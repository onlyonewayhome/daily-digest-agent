[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "daily-digest-agent"
version = "1.0.0"
description = "A configurable, provider-agnostic framework for scheduled AI-written digests."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "google-api-python-client>=2.140",
  "google-auth>=2.34",
  "google-genai>=1.0",
  "httpx>=0.27",
  "openai>=1.60",
  "pydantic>=2.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pip-audit>=2.10", "pytest>=8.3", "ruff>=0.6", "types-PyYAML>=6.0"]

[project.scripts]
daily-digest-agent = "daily_digest_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_digest_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["daily_digest_agent"]

[[tool.mypy.overrides]]
module = "daily_digest_agent.delivery.gmail"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "googleapiclient.*"
ignore_missing_imports = true
