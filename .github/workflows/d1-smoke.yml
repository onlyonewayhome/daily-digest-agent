name: D1 integration smoke
on:
  workflow_dispatch:
jobs:
  d1-smoke:
    if: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -c constraints/runtime.txt .
      - name: Initialize and inspect D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          from daily_digest_agent.storage.d1 import D1StateStore

          store = D1StateStore(
              os.environ["CLOUDFLARE_ACCOUNT_ID"],
              os.environ["D1_DATABASE_ID"],
              os.environ["CLOUDFLARE_API_TOKEN"],
          )
          store.initialize()
          print(store.get_last_run())
          print(store.list_deliveries(1))
          PY