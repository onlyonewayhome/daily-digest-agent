name: Daily digest
on:
  schedule:
    - cron: "17 15 * * *" # 15:17 UTC; change for the deployment's desired cadence.
  workflow_dispatch:
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}
      - run: pip install -c constraints/runtime.txt .
      - name: Write deployment configuration
        if: ${{ secrets.DIGEST_CONFIG_YAML != '' }}
        env:
          DIGEST_CONFIG_YAML: ${{ secrets.DIGEST_CONFIG_YAML }}
        run: printf '%s' "$DIGEST_CONFIG_YAML" > config/digest.yaml
      - name: Validate deployment configuration exists
        run: test -f config/digest.yaml
      - run: daily-digest-agent run --config config/digest.yaml
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
