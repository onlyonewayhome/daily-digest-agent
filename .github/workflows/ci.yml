name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src

  config:
    name: Config & normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_config.py tests/test_normalize.py

  budget:
    name: Budget safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_budgeting.py

  discovery:
    name: Discovery & provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_discovery_gemini.py

  providers:
    name: Provider boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_classification_gemini.py tests/test_writer_openai.py tests/test_writer_html.py tests/test_delivery_gmail.py

  storage:
    name: Storage & migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_storage.py tests/test_storage_contract.py

  retry:
    name: Retry behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_retry.py

  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_pipeline.py

  persistent-dedupe:
    name: Persistent deduplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: |
          pytest -q \
            tests/test_pipeline.py::test_persisted_story_is_not_reclassified_on_second_run \
            tests/test_pipeline.py::test_grounded_canonical_story_is_not_reclassified_on_second_run \
            tests/test_pipeline.py::test_new_story_on_second_run_is_still_classified

  package:
    name: Package artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: daily-digest-agent validate-config --config config/example.yaml
      - run: python -m build
      - name: Verify artifact manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          required = {
              "daily_digest_agent/main.py",
              "daily_digest_agent/writers/html.py",
              "daily_digest_agent/writers/openai.py",
          }
          with zipfile.ZipFile(wheel) as archive:
              wheel_files = set(archive.namelist())
          missing_wheel = required - wheel_files
          if missing_wheel:
              raise SystemExit(f"Wheel is missing runtime files: {sorted(missing_wheel)}")
          with tarfile.open(sdist, "r:gz") as archive:
              sdist_files = {"/".join(Path(name).parts[1:]) for name in archive.getnames()}
          missing_sdist = {f"src/{name}" for name in required} - sdist_files
          if missing_sdist:
              raise SystemExit(f"Sdist is missing runtime files: {sorted(missing_sdist)}")
          PY
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/daily-digest-wheel-test
          /tmp/daily-digest-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/daily-digest-wheel-test/bin/python -c \
            "import daily_digest_agent; from daily_digest_agent.writers.html import sanitize_email_html; print(daily_digest_agent.__version__)"
          /tmp/daily-digest-wheel-test/bin/daily-digest-agent validate-config \
            --config "$GITHUB_WORKSPACE/config/example.yaml"
